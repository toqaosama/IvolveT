apiVersion: v1
kind: Namespace
metadata:
  name: ivolve
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demoapp
  namespace: ivolve
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demoapp
  template:
    metadata:
      labels:
        app: demoapp
    spec:
      containers:
        - name: demoapp
          image: toqaosama/demoapp:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: demoapp-svc
  namespace: ivolve
spec:
  selector:
    app: demoapp
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
  type: NodePort
