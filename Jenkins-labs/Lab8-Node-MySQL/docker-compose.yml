services:
  app:
    build:
      context: .
    image: toqaosama/ivolve-app:latest
    ports:
      - "3000:3000"
    environment:
      DB_HOST: db
      DB_USER: ivolve_user
      DB_PASSWORD: ${DB_PASSWORD:-ivolve_local_password_change_me}
      DB_NAME: ivolve
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app_logs:/app/logs
    networks:
      - ivolve-net
    restart: unless-stopped

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local_root_password_change_me}
      MYSQL_DATABASE: ivolve
      MYSQL_USER: ivolve_user
      MYSQL_PASSWORD: ${DB_PASSWORD:-ivolve_local_password_change_me}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - ivolve-net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

networks:
  ivolve-net:
    name: ivolve-net
    driver: bridge

volumes:
  app_logs:
  db_data:
