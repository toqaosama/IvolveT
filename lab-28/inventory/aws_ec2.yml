# Dynamic inventory: find running EC2 instances tagged server=ivolve
plugin: amazon.aws.aws_ec2
regions:
  - us-east-1
filters:
  tag:server: ivolve
  instance-state-name: running
hostnames:
  - tag:Name
  - instance-id
compose:
  ansible_host: public_ip_address
keyed_groups:
  # creates group "server_ivolve"
  - key: tags.server
    prefix: server
