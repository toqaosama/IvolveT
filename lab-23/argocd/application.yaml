apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ivovle
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/toqa68/IvolveT.git
    targetRevision: main
    path: lab-23/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: ivolve
  syncPolicy:
    automated:
      prune: true      # delete resources removed from Git
      selfHeal: true   # undo manual changes made in the cluster
    syncOptions:
      - CreateNamespace=true
